<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Дневник ДЗ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%233F6BDB%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%2212%22%20width%3D%2230%22%20height%3D%2238%22%20rx%3D%224%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%2212%22%20width%3D%225%22%20height%3D%2238%22%20fill%3D%22%238FA9F0%22%2F%3E%3Cpath%20d%3D%22M27%2022h14M27%2029h14M27%2036h8%22%20stroke%3D%22%23C5D2F5%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2245%22%20cy%3D%2246%22%20r%3D%229%22%20fill%3D%22%232E9E6A%22%2F%3E%3Cpath%20d%3D%22M40.5%2046l3%203%206-6%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%233F6BDB%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%2212%22%20width%3D%2230%22%20height%3D%2238%22%20rx%3D%224%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%2212%22%20width%3D%225%22%20height%3D%2238%22%20fill%3D%22%238FA9F0%22%2F%3E%3Cpath%20d%3D%22M27%2022h14M27%2029h14M27%2036h8%22%20stroke%3D%22%23C5D2F5%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2245%22%20cy%3D%2246%22%20r%3D%229%22%20fill%3D%22%232E9E6A%22%2F%3E%3Cpath%20d%3D%22M40.5%2046l3%203%206-6%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.field-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:-4px;padding-inline:2px}

:root{
  --ground:#EEF1F6; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#18202E; --muted:#636D80; --faint:#9AA3B3; --line:#E0E5EC;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --accent-soft:#E4EBFB;
  --red:#C23D36; --red-soft:#FBE6E4; --green:#248A5E; --green-soft:#DFF2E8; --amber:#A96E12; --amber-soft:#FBEFD8;
  --margin:#E7A09E; --scrim:rgba(20,26,38,.42); --shadow:0 -8px 30px rgba(24,32,46,.16);
  --display:'Unbounded','Onest',system-ui,sans-serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1117; --surface:#171B23; --surface-2:#1F242E; --ink:#E8ECF3; --muted:#A0A9B8; --faint:#6D7688; --line:#2A303B;
    --accent:#7F9FF6; --accent-ink:#0E1117; --accent-soft:#1E2944;
    --red:#EF8078; --red-soft:#3B201F; --green:#5CC596; --green-soft:#16302A; --amber:#E4B35E; --amber-soft:#352A16;
    --margin:#6E3B3B; --scrim:rgba(0,0,0,.6); --shadow:0 -8px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1117; --surface:#171B23; --surface-2:#1F242E; --ink:#E8ECF3; --muted:#A0A9B8; --faint:#6D7688; --line:#2A303B;
  --accent:#7F9FF6; --accent-ink:#0E1117; --accent-soft:#1E2944;
  --red:#EF8078; --red-soft:#3B201F; --green:#5CC596; --green-soft:#16302A; --amber:#E4B35E; --amber-soft:#352A16;
  --margin:#6E3B3B; --scrim:rgba(0,0,0,.6); --shadow:0 -8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(104px + env(safe-area-inset-bottom,0px))}
.app.no-tabs{padding-block-end:32px}

/* headers */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:10px 18px}
.head h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.head .sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.head-actions{display:flex;gap:6px;flex-shrink:0}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);padding:6px 0;font-weight:500}

/* groups */
.section{display:flex;flex-direction:column;gap:8px;margin-block-end:24px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-inline:4px;margin:0}
.section-title h2{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.section-title .aside{font-size:13px;color:var(--muted)}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
button.row:hover,.row.tap:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{display:flex;align-items:center;gap:7px;font-weight:600}
.row-text{white-space:pre-wrap;overflow-wrap:anywhere}
.row-text.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.row-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.strike{text-decoration:line-through;color:var(--faint)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chev{color:var(--faint);align-self:center;flex-shrink:0}

/* diary page: red margin rule like a school дневник */
.ruled{position:relative}
.ruled::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:1px;background:var(--margin);pointer-events:none}
.ruled .row{padding-left:0}
.num{width:44px;flex-shrink:0;text-align:center;font-family:var(--display);font-weight:500;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.ruled .row-main{padding-left:4px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.overdue{background:var(--red-soft);color:var(--red)}
.pill.today{background:var(--amber-soft);color:var(--amber)}
.pill.tomorrow{background:var(--accent-soft);color:var(--accent)}
.pill.later{background:var(--surface-2);color:var(--muted)}
.pill.done{background:var(--green-soft);color:var(--green)}

/* check */
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);background:none;flex-shrink:0;display:grid;place-items:center;padding:0;margin-top:-1px;color:transparent;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--green);border-color:var(--green);color:#fff}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);width:100%;text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn.secondary{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>*{flex:1 1 140px}
.icon-btn{border:0;background:var(--surface);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--accent)}
.icon-btn.plain{background:none}
.icon-btn:hover{background:var(--surface-2)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 2px}
.action-row{color:var(--accent);font-weight:500;align-items:center}
.action-row.danger{color:var(--red)}
input.field,textarea.field,select.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;outline:none}
input.field:focus,textarea.field:focus{border-color:var(--accent)}
textarea.field{min-height:130px;resize:vertical}
.inline-input{flex:1;min-width:0;border:0;background:transparent;padding:0;outline:none;font-weight:500}
.inline-input::placeholder{color:var(--faint);font-weight:400}

/* banner */
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--amber-soft);color:var(--ink);border-radius:14px;padding:12px 14px;margin-block-end:20px}
.banner.info{background:var(--accent-soft)}
.banner b{display:block;margin-bottom:2px}
.banner ul{margin:4px 0 0;padding-left:18px}

.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}

/* week strip */
.week{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:14px;padding:10px 6px;margin-block-end:18px}
.week-days{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.wd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border-radius:10px}
.wd small{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted)}
.wd span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.wd.today span{color:var(--accent)}
.wd.sel span{background:var(--accent);color:var(--accent-ink)}
.wd i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.7}
.wd i.none{background:transparent}
.week-label{text-align:center;color:var(--muted);font-size:13px;margin:-8px 0 14px}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;width:100%}
.seg button{border:0;background:none;border-radius:8px;padding:8px 4px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* switch */
.switch{position:relative;width:50px;height:30px;flex-shrink:0}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px 6px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--faint);font-size:11px;font-weight:500;padding:4px 0}
.tab.on{color:var(--accent)}
.tab-add{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:0}
.tab-add span{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 16px rgba(47,91,211,.35);border:4px solid var(--surface)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .18s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--ground);border-radius:20px 20px 0 0;max-height:calc(92vh - env(safe-area-inset-top,0px));max-height:calc(92dvh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet-head{flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 16px 10px}
.sheet-head h3{margin:0;font-size:16px;font-weight:600;text-align:center}
.sheet-head .l{justify-self:start}.sheet-head .r{justify-self:end}
.grabber{flex-shrink:0;width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{animation:none}}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button.open{position:absolute;inset:0;border:0;background:none;padding:0}
.ph .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;padding:0}
.add-tile{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;cursor:pointer;background:none}
.add-tile:hover{border-color:var(--accent);color:var(--accent)}
.add-tile input{display:none}
.big-photo{width:100%;border-radius:12px;display:block}

/* onboarding */
.hero{display:flex;flex-direction:column;gap:14px;padding-block:28px 26px}
.hero h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:16px;max-width:36ch}
.preview{background:var(--surface);border-radius:14px;overflow:hidden}
.preview-head{padding:10px 14px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:10px}
label.btn{cursor:pointer}
label.btn input{display:none}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--red);font-size:14px}
.note{font-size:13px;color:var(--muted);padding-inline:4px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-weight:500;z-index:60;max-width:calc(100% - 32px);text-align:center;animation:fade .15s ease}
.date-options .row{align-items:center}
.opt-label{font-size:13px;color:var(--muted);font-weight:500}
.opt-date{font-weight:600}
.lesson-ctrl{display:flex;gap:2px;flex-shrink:0;align-self:center}
.lesson-ctrl button{width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);display:grid;place-items:center;padding:0}
.lesson-ctrl button:hover:not([disabled]){background:var(--surface-2);color:var(--ink)}
.lesson-ctrl button[disabled]{opacity:.3;cursor:default}
.lesson-ctrl button.del:hover{color:var(--red)}
.time{font-variant-numeric:tabular-nums}
.room{font-variant-numeric:tabular-nums}
.row.gap{padding-block:8px}
.row.gap .row-main{color:var(--faint);font-size:14px}
.room-input{width:64px;flex-shrink:0;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 7px;font-size:13px;text-align:center;outline:none;font-variant-numeric:tabular-nums}
.room-input:focus{border-color:var(--accent)}
.day-range{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.bells{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px;padding:12px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.bells span b{display:inline-block;width:22px;color:var(--muted);font-weight:600}
.plan-card{background:var(--accent-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-block-end:24px}
.plan-head{display:flex;gap:12px;align-items:flex-start}
.plan-head b{display:block;font-size:16px;margin-bottom:2px}
.plan-head span{color:var(--muted);font-size:14px}
.plan-icon{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.plan-list{display:flex;flex-direction:column;gap:6px}
.plan-item{display:flex;flex-direction:column;gap:3px;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:10px 12px;width:100%}
.plan-item:hover{background:var(--surface-2)}
.plan-foot{margin:0;font-size:13px;color:var(--muted);padding-inline:2px}
.plan-chip{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:500}
.plan-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.plan-day{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 11px}
.plan-day b{font-weight:600;font-size:14px}
.plan-day em{font-style:normal;font-size:11px;font-weight:600;color:var(--green);background:var(--green-soft);border-radius:999px;padding:1px 6px;margin-left:2px;white-space:nowrap}
.plan-day span{font-size:12px;color:var(--muted)}
.plan-day:hover{border-color:var(--accent)}
.plan-day.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
input.field.num-field{width:88px;flex:0 0 88px;text-align:center}
.row>label.row-main{min-width:0}
.sub-label{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:4px 4px 0;margin:0}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(() => {
'use strict';

/* ---------- constants ---------- */

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b === 1) return one;
  if (b >= 2 && b <= 4) return few;
  return many;
}
function dueStatus(due) {
  const d = daysBetween(ymd(today()), due);
  if (d < 0) return {cls:'overdue', label:'Просрочено'};
  if (d === 0) return {cls:'today', label:'Сегодня'};
  if (d === 1) return {cls:'tomorrow', label:'Завтра'};
  return {cls:'later', label:'Через ' + d + ' ' + plural(d, 'день', 'дня', 'дней')};
}

async function run(p) { const {data, error} = await p; if (error) throw error; return data; }
function dataURLtoBlob(u) {
  const [head, b64] = u.split(',');
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:(head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg'});
}
/* Supabase signs people in by email, so each name maps to a stable
   technical address. Nobody sees it and no mail is ever sent to it. */
async function nameToEmail(name) {
  const n = String(name).trim().replace(/\s+/g, ' ').toLowerCase();
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(n));
  return 'u' + [...new Uint8Array(buf)].slice(0, 16).map(b => b.toString(16).padStart(2, '0')).join('') + '@' + EMAIL_DOMAIN;
}

/* One request at a time per record, so edits arrive in order. */
const chains = new Map();
function queue(key, fn) {
  const next = (chains.get(key) || Promise.resolve()).then(fn).catch(e => {
    showToast(errText(e, 'Не удалось сохранить.'));
    refresh();
    return 'failed';
  });
  chains.set(key, next);
  return next;
}

async function removePhotos(ids) {
  for (let i = 0; i < ids.length; i += 100) {
    try { await sb.storage.from(PHOTO_BUCKET).remove(ids.slice(i, i + 100).map(id => id + '.jpg')); } catch (e) {}
  }
  ids.forEach(id => photoUrls.delete(id));
}

/* Photos are private: the page asks for links that expire after an hour. */
const photoUrls = new Map();
async function signPhotos(ids) {
  const now = Date.now();
  const need = [...new Set(ids)].filter(id => !(photoUrls.get(id)?.exp > now + 60000));
  if (need.length) {
    try {
      const res = await run(sb.storage.from(PHOTO_BUCKET).createSignedUrls(need.map(id => id + '.jpg'), 3600));
      res.forEach((r, i) => { if (r.signedUrl) photoUrls.set(need[i], {url:r.signedUrl, exp:now + 3600000}); });
    } catch (e) {}
  }
  return ids.map(id => photoUrls.get(id)?.url || null);
}
async function hydratePhotos(root) {
  const imgs = [...root.querySelectorAll('img[data-photo]')];
  if (!imgs.length) return;
  const urls = await signPhotos(imgs.map(i => i.dataset.photo));
  imgs.forEach((img, i) => { if (urls[i]) img.src = urls[i]; });
}

function isMissingSchema(e) {
  const m = String(e?.message || '');
  return e?.code === 'PGRST205' || e?.code === '42P01' || /does not exist|Could not find the table|schema cache/i.test(m);
}

let refreshing = false, refreshAgain = false;
async function refresh() {
  if (!sb) { store.ready = true; store.setupError = 'Не загрузилась библиотека Supabase. Проверь интернет и обнови страницу.'; render(); return; }
  if (refreshing) { refreshAgain = true; return; }
  refreshing = true;
  try {
    const {data:{session}} = await sb.auth.getSession();
    if (!session) {
      store.authed = false; closeLive();
    } else {
      store.uid = session.user.id; store.email = session.user.email;
      const [sched, hws, profs, pref] = await Promise.all([
        run(sb.from('class_schedule').select('data').eq('id', 1).maybeSingle()),
        run(sb.from('homeworks').select('*').order('due')),
        run(sb.from('profiles').select('id,name,is_admin')),
        run(sb.from('prefs').select('data').eq('user_id', store.uid).maybeSingle())
      ]);
      const me = profs.find(p => p.id === store.uid);
      if (!me) {
        await sb.auth.signOut();
        store.authed = false;
        ui.authError = 'Учётная запись создана до настройки базы. Зарегистрируйся заново под другим именем.';
      } else {
        store.me = {id:me.id, name:me.name, admin:me.is_admin}; store.isAdmin = !!me.is_admin;
        store.users = Object.fromEntries(profs.map(p => [p.id, p.name]));
        applySchedule(sched?.data || {});
        state.homeworks = hws.map(rowToHw);
        applyPrefs(pref?.data || null);
        if (store.isAdmin) {
          const cfg = await run(sb.from('app_config').select('invite_code').eq('id', 1).maybeSingle());
          store.invite = cfg?.invite_code || '';
        }
        store.authed = true; store.offline = false; store.setupError = null;
        connectLive();
      }
    }
  } catch (e) {
    if (isMissingSchema(e)) store.setupError = 'В Supabase ещё не созданы таблицы. Выполни файл supabase/schema.sql в SQL Editor и обнови страницу.';
    else if (errText(e, '') === offlineMsg) store.offline = true;
    else showToast(errText(e, 'Не удалось загрузить дневник.'));
  }
  store.ready = true; refreshing = false;
  applyTheme(); rerender();
  if (refreshAgain) { refreshAgain = false; refresh(); }
}

/* Live updates: Supabase Realtime notifies every open page about changes. */
let live = null, liveTimer = null;
function connectLive() {
  if (live) return;
  const ping = () => { clearTimeout(liveTimer); liveTimer = setTimeout(refresh, 250); };
  live = sb.channel('dnevnik-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'homeworks'}, ping)
    .on('postgres_changes', {event:'*', schema:'public', table:'class_schedule'}, ping)
    .on('postgres_changes', {event:'*', schema:'public', table:'profiles'}, ping)
    .subscribe(status => { if (status === 'SUBSCRIBED' && store.offline) refresh(); });
}
function closeLive() { if (live) { sb.removeChannel(live); live = null; } }
document.addEventListener('visibilitychange', () => { if (!document.hidden && store.authed) refresh(); });
function authErrText(e, reg) {
  if (e?.userMessage) return e.userMessage;
  const m = String(e?.message || ''), c = e?.code || '';
  if (c === 'user_already_exists' || /already registered/i.test(m)) return 'Это имя уже занято. Придумай другое или войди.';
  if (c === 'invalid_credentials' || /Invalid login credentials/i.test(m)) return 'Неверное имя или пароль.';
  if (c === 'weak_password' || /Password should/i.test(m)) return 'Пароль должен быть не короче 6 символов.';
  if (/rate limit/i.test(m) || c === 'over_request_rate_limit' || c === 'over_email_send_rate_limit') return 'Слишком много попыток. Подожди немного и попробуй снова.';
  if (c === 'signup_disabled' || /Signups not allowed/i.test(m)) return 'Регистрация выключена в настройках Supabase.';
  if (c === 'email_address_invalid' || /Email address .* is invalid/i.test(m)) return 'Supabase не принял регистрацию. Сообщи администратору дневника.';
  if (reg && (c === 'unexpected_failure' || /Database error saving new user/i.test(m))) return 'Неверный код класса. Спроси его у администратора дневника.';
  return errText(e, reg ? 'Не получилось зарегистрироваться.' : 'Не получилось войти.');
}

/* ---------- domain: schedule ---------- */
const subjectById = id => state.subjects.find(s => s.id === id);
const lessonsFor = wd => state.lessons.filter(l => l.weekday === wd).sort((a, b) => a.period - b.period);
const maxPeriod = wd => lessonsFor(wd).reduce((m, l) => Math.max(m, l.period), 0);
function findOrCreateSubject(name) {
  const clean = String(name || '').trim().replace(/\s+/g, ' ');
  if (!clean) return null;
  const hit = state.subjects.find(s => s.name.toLowerCase() === clean.toLowerCase());
  if (hit) return hit;
  const s = {id:uid(), name:cap(clean), color:PALETTE[state.subjects.length % PALETTE.length]};
  state.subjects.push(s);
  return s;
}
/* A lesson's `period` is its real lesson number, so a free slot stays a gap. */
function addLesson(wd, subjectId, period) {
  const p = period || Math.min(MAX_PERIOD, maxPeriod(wd) + 1);
  const prev = state.lessons.filter(l => l.subjectId === subjectId && l.room).pop();
  state.lessons.push({id:uid(), weekday:wd, period:p, subjectId, room:prev ? prev.room : ''});
}
function moveLesson(id, dir) {
  const l = state.lessons.find(x => x.id === id); if (!l) return;
  const target = l.period + dir;
  if (target < 1 || target > MAX_PERIOD) return;
  const other = state.lessons.find(x => x.weekday === l.weekday && x.period === target);
  if (other) other.period = l.period;
  l.period = target;
}
function removeLesson(id) { state.lessons = state.lessons.filter(x => x.id !== id); }
function replaceSchedule(draft) {
  state.lessons = [];
  for (const wd of SCHOOL_DAYS) {
    (draft[wd] || []).forEach((name, i) => {
      const s = findOrCreateSubject(name);
      if (s) state.lessons.push({id:uid(), weekday:wd, period:i + 1, subjectId:s.id, room:''});
    });
  }
}

/* The heart of the app: real upcoming lesson dates for a subject. It scans
   forward day by day from tomorrow, so week, month and year boundaries are
   plain calendar arithmetic, and two lessons on one day count as one date. */
function nextLessonDates(subjectId, from = today(), count = 3) {
  const days = new Set(state.lessons.filter(l => l.subjectId === subjectId).map(l => l.weekday));
  if (!days.size) return [];
  const out = [];
  for (let i = 1; i <= 730 && out.length < count; i++) {
    const d = addDays(from, i);
    if (days.has(d.getDay())) out.push(ymd(d));
  }
  return out;
}

/* Bells: each lesson is lessonLen minutes, followed by a breakLen break. */
function toMin(hhmm) { const [h, m] = String(hhmm || '08:00').split(':').map(Number); return h * 60 + (m || 0); }
function fromMin(m) { return Math.floor(m / 60) + ':' + pad(m % 60); }
function slotTimes(period) {
  const s = state.settings, len = Number(s.lessonLen) || 40, brk = Number(s.breakLen) || 0;
  const start = toMin(s.dayStart) + (period - 1) * (len + brk);
  return {start:fromMin(start), end:fromMin(start + len)};
}
const slotLabel = p => { const t = slotTimes(p); return t.start + '–' + t.end; };
function dayRange(wd) {
  const ls = lessonsFor(wd);
  if (!ls.length) return null;
  return {from:slotTimes(ls[0].period).start, to:slotTimes(ls[ls.length - 1].period).end, count:ls.length};
}
const dayRangeLabel = wd => { const r = dayRange(wd); return r ? 'с ' + r.from + ' до ' + r.to : 'уроков нет'; };
const periodsOn = (subjectId, wd) => lessonsFor(wd).filter(l => l.subjectId === subjectId).map(l => l.period);
function periodsLabel(ps) {
  if (!ps.length) return '';
  const t = ps.length > 1 ? slotTimes(ps[0]).start + '–' + slotTimes(ps[ps.length - 1]).end : slotLabel(ps[0]);
  return (ps.length > 1 ? 'уроки ' + ps.join(', ') : ps[0] + ' урок') + ' · ' + t;
}

/* ---------- domain: homework ---------- */
const hwById = id => state.homeworks.find(h => h.id === id);
const hwOn = due => state.homeworks.filter(h => h.due === due);
function toggleDone(id) {
  const h = hwById(id); if (!h) return;
  if (isDone(h)) delete state.done[id]; else state.done[id] = new Date().toISOString();

function deleteHomework(id) {
  const photos = hwById(id)?.photos || [];
  state.homeworks = state.homeworks.filter(x => x.id !== id);
  removeHwDoc(id, photos);
  if (state.done[id]) { delete state.done[id]; savePrefs(); }
}
function deleteSubject(id) {
  state.homeworks.filter(h => h.subjectId === id).forEach(h => deleteHomework(h.id));
  state.lessons = state.lessons.filter(l => l.subjectId !== id);
  state.subjects = state.subjects.filter(s => s.id !== id);
  saveSchedule();
}
/* ---------- planning: when to do homework that is due later ----------
   Homework due in 2+ days can be done earlier, on a light day. A day's load is
   its lesson count plus the unfinished homework already due the next morning,
   because that is what the evening is spent on. Sunday has no lessons, so it
   often wins; ties go to the earlier day so the work isn't put off. */
const PLAN_MIN_DAYS = 2;
const canPlan = h => !isDone(h) && daysBetween(ymd(today()), h.due) >= PLAN_MIN_DAYS;
function dayLoad(dateStr, exceptId) {
  const lessons = lessonsFor(parse(dateStr).getDay()).length;
  const next = ymd(addDays(parse(dateStr), 1));
  const dueNext = state.homeworks.filter(x => x.due === next && x.id !== exceptId && !isDone(x)).length;
  return {lessons, dueNext, score:lessons + dueNext * 1.5};
}
function planCandidates(h) {
  const out = [];
  for (let d = today(); ymd(d) < h.due && out.length < 14; d = addDays(d, 1)) {
    const k = ymd(d);
    out.push({date:k, ...dayLoad(k, h.id)});
  }
  return out;
}
function suggestedDay(h) {
  if (!canPlan(h)) return null;
  let best = null;
  for (const c of planCandidates(h)) if (!best || c.score < best.score) best = c;
  return best ? best.date : null;
}
function plannedDay(h) {
  if (!canPlan(h)) return null;
  const p = state.plan[h.id];
  if (p && p >= ymd(today()) && p < h.due) return p;
  return suggestedDay(h);
}
function dayWord(dateStr) {
  const d = daysBetween(ymd(today()), dateStr);
  if (d === 0) return 'сегодня';
  if (d === 1) return 'завтра';
  return WD_SHORT[parse(dateStr).getDay()].toLowerCase() + ', ' + shortDate(dateStr);
}
function loadLabel(c) {
  const parts = [c.lessons ? c.lessons + ' ' + plural(c.lessons, 'урок', 'урока', 'уроков') : 'нет уроков'];
  if (c.dueNext) parts.push('на следующий день ' + c.dueNext + ' ' + plural(c.dueNext, 'задание', 'задания', 'заданий'));
  return parts.join(', ');
}

/* ---------- images ---------- */
function readAsDataURL(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}
async function compressImage(file) {
  const src = await readAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const attempt = (max, q) => {
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  };
  let out = attempt(1600, .8);
  if (out.length > 1500000) out = attempt(1200, .7);
  return out;
}

function dayPlan(dateStr) {

    rows.push('<div class="row tap" role="button" tabindex="0" ' + act + '><span class="num">' + p + '</span><div class="row-main"><div class="row-title">' + subjectTitle(l.subjectId) + '</div>' + meta + body + '</div>' + (h ? checkBtn(h) : '') + '</div>');
  }

/* ---------- main render ---------- */
const app = document.getElementById('app');
function render() {
  let html, tabs = true;
  const p = ui.page;
  if (!store.ready) { html = screenLoading(); tabs = false; }
  else if (store.setupError) { html = screenSetup(); tabs = false; }
  else if (!store.authed && store.offline) { html = screenOffline(); tabs = false; }
  else if (!store.authed) { html = screenAuth(); tabs = false; }
  else if (p?.name === 'review') { html = pageReview(); tabs = hasSchedule(); }
  else if (!hasSchedule()) { html = screenOnboarding(); tabs = false; }
  else if (p?.name === 'day') html = pageDay(p.wd);
  else if (p?.name === 'subjects') html = pageSubjects();
  else if (p?.name === 'history') html = pageHistory();
  else if (p?.name === 'class' && store.isAdmin) html = pageClass();
  else html = {today:screenToday, calendar:screenCalendar, schedule:screenSchedule, settings:screenSettings}[ui.tab]();

  if (tabs) {
    const t = (k, icon, label) => '<button class="tab' + (ui.tab === k ? ' on' : '') + '" data-act="tab" data-tab="' + k + '"' + (ui.tab === k ? ' aria-current="page"' : '') + '>' + icon + '<span>' + label + '</span></button>';
    html += '<nav class="tabbar" aria-label="Разделы"><div class="tabbar-inner">' + t('today', I.sun, 'Сегодня') + t('calendar', I.cal, 'Календарь') +
      '<button class="tab-add" data-act="add" aria-label="Добавить домашнее задание"><span>' + I.plus + '</span>ДЗ</button>' +
      t('schedule', I.list, 'Расписание') + t('settings', I.gear, 'Настройки') + '</div></nav>';
  }
  app.className = 'app' + (tabs ? '' : ' no-tabs');
  app.innerHTML = html;
}
function rerender() {
  const a = document.activeElement;
  const typingInPage = a && app.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type !== 'checkbox';
  if (!typingInPage) render();
  if (!ui.sheet) return;
  if (a && sheetRoot.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
  renderSheet();
}

/* ---------- sheets ---------- */
const sheetRoot = document.getElementById('sheet-root');
function openSheet(s) { ui.sheet = s; renderSheet(); }
function closeSheet() { ui.sheet = null; renderSheet(); }
function sheetFrame(title, body, left = '<button class="link l" data-act="close">Закрыть</button>', right = '') {
  return '<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="grabber"></div><div class="sheet-head"><span class="l">' + left + '</span><h3>' + esc(title) + '</h3><span class="r">' + right + '</span></div><div class="sheet-body">' + body + '</div></div>';
}
function subjectPickList(act) {
  const sorted = [...state.subjects].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  return (sorted.length ? '<div class="list">' + sorted.map(s => '<button class="row" style="align-items:center" data-act="' + act + '" data-id="' + s.id + '"><span class="row-main"><span class="row-title">' + dot(s.color) + esc(s.name) + '</span></span><span class="chev">' + I.chev + '</span></button>').join('') + '</div>' : '') +
    '<div class="list"><div class="row" style="align-items:center">' + I.plusSm + '<input class="inline-input" id="new-subject" placeholder="Новый предмет" aria-label="Новый предмет"><button class="link" data-act="' + act + '-new">Добавить</button></div></div>';
}
function renderSheet() {
  const s = ui.sheet;
  if (!s) { sheetRoot.innerHTML = ''; document.body.style.overflow = ''; return; }
  document.body.style.overflow = 'hidden';
  let html = '';
  if (s.type === 'add') {
    if (s.step === 'subject') {
      let body;
      if (s.presetDue) {
        const wd = parse(s.presetDue).getDay();
        const dayIds = [...new Set(lessonsFor(wd).map(l => l.subjectId))];
        body = (dayIds.length ? '<p class="sub-label">Уроки ' + esc(longDate(s.presetDue)) + '</p><div class="list">' + dayIds.map(id => {
          const sub = subjectById(id);
          return '<button class="row" style="align-items:center" data-act="pick-add" data-id="' + id + '"><span class="row-main"><span class="row-title">' + dot(sub?.color) + esc(sub?.name) + '</span><span class="row-meta">' + esc(periodsLabel(periodsOn(id, wd))) + '</span></span><span class="chev">' + I.chev + '</span></button>';
        }).join('') + '</div>' : '<div class="banner info"><div>В этот день уроков нет. Можно выбрать любой предмет.</div></div>') +
          '<p class="sub-label">Другой предмет</p>' + subjectPickList('pick-add');
      } else body = subjectPickList('pick-add');
      html = sheetFrame(s.presetDue ? 'ДЗ на ' + shortDate(s.presetDue) : 'Предмет', body, '<button class="link l" data-act="close">Отмена</button>');
    } else if (s.step === 'date') {
      const sub = subjectById(s.subjectId);
      const dates = nextLessonDates(s.subjectId, today(), 3);
      const labels = ['Следующий урок', 'Через урок', 'Через два урока'];
      const body = '<div class="row-title" style="padding-inline:4px">' + dot(sub?.color) + esc(sub?.name) + '</div>' +
        (dates.length ? '<div class="list date-options">' + dates.map((d, i) => '<button class="row" data-act="pick-date" data-due="' + d + '"><span class="row-main"><span class="opt-label">' + labels[i] + '</span><span class="opt-date">' + esc(longDate(d)) + '</span><span class="row-meta time">' + esc(periodsLabel(periodsOn(s.subjectId, parse(d).getDay()))) + '</span></span><span class="pill ' + dueStatus(d).cls + '">' + dueStatus(d).label + '</span><span class="chev">' + I.chev + '</span></button>').join('') + '</div>'
          : '<div class="banner info"><div>Этого предмета нет в расписании. Выбери дату вручную или добавь предмет в расписание.</div></div>') +
        '<div class="section" style="margin:0"><div class="section-title"><h2>Выбрать другую дату</h2></div><div class="btn-row"><input type="date" class="field" id="custom-due" value="' + (s.due || ymd(addDays(today(), 1))) + '" aria-label="Дата сдачи"><button class="btn secondary" data-act="custom-date">Продолжить</button></div></div>';
      html = sheetFrame('Когда сдать?', body, '<button class="link l" data-act="add-back">Назад</button>');
    } else {
      const sub = subjectById(s.subjectId);
      const ps = periodsOn(s.subjectId, parse(s.due).getDay());
      const body = '<div class="list"><button class="row" style="align-items:center" data-act="add-back"><span class="row-main"><span class="row-title">' + dot(sub?.color) + esc(sub?.name) + '</span><span class="opt-date">' + esc(longDate(s.due)) + '</span>' +
          (ps.length ? '<span class="row-meta time">' + esc(periodsLabel(ps)) + '</span>' : '<span class="row-meta">В этот день такого урока нет по расписанию</span>') +
        '</span><span class="link">Изменить</span></button></div>' +
        '<div class="section" style="margin:0"><div class="section-title"><h2>Что задано?</h2></div><textarea class="field" id="hw-text" placeholder="№1245, 1247&#10;Повторить производную">' + esc(s.text || '') + '</textarea></div>' +
        '<div class="section" style="margin:0"><div class="section-title"><h2>Фотографии</h2></div><div class="photos">' +
          (s.photos || []).map((p, i) => '<div class="ph"><img src="' + p + '" alt="Фото ' + (i + 1) + '"><button class="x" data-act="add-photo-del" data-i="' + i + '" aria-label="Убрать фото">' + I.x + '</button></div>').join('') +
          '<label class="add-tile">' + I.camera + 'Камера<input type="file" accept="image/*" capture="environment" data-file="add-photo"></label>' +
          '<label class="add-tile">' + I.image + 'Галерея<input type="file" accept="image/*" multiple data-file="add-photo"></label>' +

      '<div class="section" style="margin:0"><div class="section-title"><h2>Что задано</h2><span class="aside" id="saved-note">' + esc(by) + '</span></div><textarea class="field" data-hw-text="' + h.id + '">' + esc(h.text) + '</textarea></div>' + planSec +
      '<div class="section" style="margin:0"><div class="section-title"><h2>Фотографии</h2></div><div class="photos">' +
        (h.photos || []).map(pid => '<div class="ph"><img data-photo="' + esc(pid) + '" alt="Фото задания"><button class="open" data-act="view-photo" data-pid="' + esc(pid) + '" aria-label="Открыть фото"></button><button class="x" data-act="hw-photo-del" data-pid="' + esc(pid) + '" aria-label="Удалить фото">' + I.x + '</button></div>').join('') +
        '<label class="add-tile">' + I.camera + 'Камера<input type="file" accept="image/*" capture="environment" data-file="hw-photo"></label>' +
        '<label class="add-tile">' + I.image + 'Галерея<input type="file" accept="image/*" multiple data-file="hw-photo"></label>' +
      '</div>' + (s.loading ? '<p class="muted" style="display:flex;gap:8px;align-items:center;margin:0"><span class="spinner"></span>Добавляю фото…</p>' : '') + '</div>' +
      '<div class="stack"><button class="btn ' + (done ? 'secondary' : '') + '" data-act="toggle" data-id="' + h.id + '">' + (done ? 'Отменить выполнение' : I.check + 'Отметить выполненным') + '</button>' +
      (s.confirmDelete
        ? '<div class="banner" style="background:var(--red-soft);margin:0;flex-direction:column"><b>Удалить это задание для всего класса вместе с фото?</b><div class="btn-row" style="width:100%"><button class="btn danger" style="background:var(--red);color:#fff" data-act="hw-delete-yes">Удалить</button><button class="btn secondary" data-act="hw-delete-no">Отмена</button></div></div>'
        : '<button class="btn danger" data-act="hw-delete">Удалить задание</button>') + '</div>';
    html = sheetFrame('Домашнее задание', body, '<span></span>', '<button class="link" data-act="close">Готово</button>');
  } else if (s.type === 'pick') {
    html = sheetFrame('Выбрать предмет', subjectPickList('pick-subject'), '<button class="link l" data-act="close">Отмена</button>');
  } else if (s.type === 'confirm') {
    html = sheetFrame(s.title, '<p style="margin:0" class="muted">' + esc(s.text) + '</p><div class="stack"><button class="btn" style="background:var(--red);color:#fff" data-act="confirm-yes">' + esc(s.label) + '</button><button class="btn secondary" data-act="close">Отмена</button></div>', '<span></span>');
  } else if (s.type === 'info') {
    html = sheetFrame(s.title, s.html + '<button class="btn" data-act="close">Понятно</button>', '<span></span>');
  } else if (s.type === 'password') {
    html = sheetFrame('Сменить пароль', '<form id="pass-form" class="stack" novalidate>' +
      '<label class="field-label" for="old-pass">Старый пароль</label><input class="field" id="old-pass" type="password" autocomplete="current-password">' +
      '<label class="field-label" for="new-pass">Новый пароль</label><input class="field" id="new-pass" type="password" autocomplete="new-password" placeholder="Не короче 6 символов">' +
      '<label class="field-label" for="new-pass2">Повтори новый пароль</label><input class="field" id="new-pass2" type="password" autocomplete="new-password">' +
      (s.error ? '<p class="err" style="margin:0" role="alert">' + esc(s.error) + '</p>' : '') +
      '<button class="btn" type="submit"' + (s.busy ? ' disabled' : '') + '>' + (s.busy ? 'Сохраняю…' : 'Сменить пароль') + '</button></form>', '<button class="link l" data-act="close">Отмена</button>');
  } else if (s.type === 'photo') {
    html = sheetFrame('Фото', '<img class="big-photo" data-photo="' + esc(s.pid) + '" alt="Фото задания">', '<span></span>', '<button class="link" data-act="close">Закрыть</button>');
  }
  const scrollTop = sheetRoot.querySelector('.sheet-body')?.scrollTop || 0;
  sheetRoot.innerHTML = html;
  const bodyEl = sheetRoot.querySelector('.sheet-body'); if (bodyEl) bodyEl.scrollTop = scrollTop;
  hydratePhotos(sheetRoot);
}

/* ---------- export / import ---------- */
async function exportData() {
  showToast('Готовлю файл…');
  const photos = {};
  const ids = state.homeworks.flatMap(h => h.photos || []);
  const urls = await signPhotos(ids);
  for (let i = 0; i < ids.length; i++) {
    if (!urls[i]) continue;
    try { const r = await fetch(urls[i]); if (r.ok) photos[ids[i]] = await readAsDataURL(await r.blob()); } catch (e) {}
  }
  const json = JSON.stringify({format:'dnevnik-dz-backup', version:3, exportedAt:new Date().toISOString(),
    schedule:scheduleBody(), homeworks:state.homeworks.map(h => ({id:h.id, createdAt:h.createdAt, author:h.author, ...hwBody(h)})), photos}, null, 2);
  const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = 'dnevnik-dz-' + ymd(today()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast('Резервная копия сохранена в «Загрузки»');
}
async function importFile(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { showToast('Это не файл резервной копии'); return; }
  if (obj?.format !== 'dnevnik-dz-backup') { showToast('Это не файл резервной копии Дневника ДЗ'); return; }
  const schedule = obj.schedule || {subjects:obj.state?.subjects, lessons:obj.state?.lessons, bells:obj.state?.settings};
  const homeworks = obj.homeworks || obj.state?.homeworks || [];
  const n = homeworks.length;
  openSheet({type:'confirm', title:'Импорт данных', text:'Расписание и задания всего класса заменятся данными из файла (' + n + ' ' + plural(n, 'задание', 'задания', 'заданий') + ').', label:'Заменить данные', fn:async () => {
    try {
      showToast('Импортирую…');
      const oldPhotos = state.homeworks.flatMap(h => h.photos || []);
      await run(sb.rpc('admin_wipe'));
      await removePhotos(oldPhotos);
      applySchedule(schedule);
      await run(sb.from('class_schedule').update({data:clone(scheduleBody()), updated_at:nowIso()}).eq('id', 1));
      for (const [pid, d] of Object.entries(obj.photos || {})) {
        if (/^[A-Za-z0-9_-]{4,40}$/.test(pid) && /^data:image\/jpeg;base64,/.test(d)) {
          await run(sb.storage.from(PHOTO_BUCKET).upload(pid + '.jpg', dataURLtoBlob(d), {contentType:'image/jpeg', upsert:true}));
        }
      }
      const rows = homeworks
        .map(h => ({id:/^[A-Za-z0-9_-]{4,40}$/.test(h.id) ? h.id : uid(), subject_id:h.subjectId, due:h.due, text:String(h.text || '').slice(0, 4000), photos:h.photos || []}))
        .filter(r => r.subject_id && /^\d{4}-\d{2}-\d{2}$/.test(r.due));
      for (let i = 0; i < rows.length; i += 200) await run(sb.from('homeworks').insert(rows.slice(i, i + 200)));
      showToast('Импортировано заданий: ' + rows.length);
      ui.page = null; ui.tab = 'today'; refresh();
    } catch (e) { showToast(errText(e, 'Не удалось импортировать.')); refresh(); }
  }});
}

/* ---------- actions ---------- */
function goPage(page) { ui.page = page; render(); window.scrollTo(0, 0); }
function startAdd(preset = {}) {
  if (preset.subjectId && preset.due) openSheet({type:'add', step:'details', subjectId:preset.subjectId, due:preset.due, text:'', photos:[]});
  else openSheet({type:'add', step:'subject', presetDue:preset.presetDue || null, subjectId:null, due:null, text:'', photos:[]});
}
function afterSubjectPicked(id) {
  const sh = ui.sheet; sh.subjectId = id;
  if (sh.presetDue) { sh.due = sh.presetDue; sh.step = 'details'; } else sh.step = 'date';
  renderSheet();
}
function applyPick(subjectId) {
  const s = ui.sheet;
  if (s.mode === 'add') addLesson(s.wd, subjectId);
  else if (s.mode === 'slot') addLesson(s.wd, subjectId, s.period);
  else { const l = state.lessons.find(x => x.id === s.lessonId); if (l) l.subjectId = subjectId; }
  saveSchedule(); closeSheet(); render();
}
function captureAddText() { const t = document.getElementById('hw-text'); if (t && ui.sheet?.type === 'add') ui.sheet.text = t.value; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'LABEL') return;
  const act = el.dataset.act;
  if (act === 'close' && ui.sheet?.type === 'photo' && ui.sheet.back) { e.preventDefault(); openSheet(ui.sheet.back); return; }
  const fn = actions[act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.sheet) { closeSheet(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.id === 'new-subject') { e.preventDefault(); actions[(ui.sheet?.type === 'add' ? 'pick-add' : 'pick-subject') + '-new'](); }
  if (e.key === 'Enter' && e.target.id === 'new-subject-page') { e.preventDefault(); actions['subject-add-page'](); }
  if (e.key === 'Enter' && e.target.matches('[data-rename],[data-room]')) e.target.blur();
});

document.addEventListener('submit', async e => {
  if (e.target.id === 'auth-form') {
    e.preventDefault();
    const reg = ui.authMode === 'register';
    const name = document.getElementById('auth-name').value.trim();
    const pass = document.getElementById('auth-pass').value;
    ui.authName = name;
    if (name.length < 2) { ui.authError = 'Введи имя, не короче 2 символов.'; render(); return; }
    if (!pass) { ui.authError = 'Введи пароль.'; render(); return; }
    if (reg && pass !== document.getElementById('auth-pass2').value) { ui.authError = 'Пароли не совпадают.'; render(); return; }
    ui.authBusy = true; ui.authError = null; render();
    try {
      if (!sb) throw {userMessage:'Не загрузилась библиотека Supabase. Проверь интернет и обнови страницу.'};
      if (reg && pass.length < 6) throw {userMessage:'Пароль должен быть не короче 6 символов.'};
      const email = await nameToEmail(name);
      if (reg) {
        const invite = (document.getElementById('auth-invite')?.value || '').trim();
        const {data, error} = await sb.auth.signUp({email, password:pass, options:{data:{name:name.replace(/\s+/g, ' '), invite}}});
        if (error) throw error;
        if (!data.session) throw {userMessage:'Регистрация прошла, но Supabase ждёт подтверждения почты. Администратору нужно выключить его: Authentication → Sign In / Providers → Email → Confirm email.'};
      } else {
        const {error} = await sb.auth.signInWithPassword({email, password:pass});
        if (error) throw error;
      }
      ui.authBusy = false; ui.tab = 'today'; ui.page = null;
      await refresh();
      if (store.authed) showToast(reg ? 'Добро пожаловать, ' + name + '!' : 'Привет, ' + (store.me?.name || name) + '!');
    } catch (err) {
      ui.authBusy = false;
      ui.authError = authErrText(err, reg);
      render();
    }
  } else if (e.target.id === 'pass-form') {
    e.preventDefault();
    const s = ui.sheet;
    const oldPassword = document.getElementById('old-pass').value, newPassword = document.getElementById('new-pass').value;
    if (newPassword !== document.getElementById('new-pass2').value) { s.error = 'Новые пароли не совпадают.'; renderSheet(); return; }
    s.busy = true; s.error = null; renderSheet();
    try {
      if (newPassword.length < 6) throw {userMessage:'Новый пароль должен быть не короче 6 символов.'};
      const check = await sb.auth.signInWithPassword({email:store.email, password:oldPassword});
      if (check.error) throw {userMessage:check.error.code === 'invalid_credentials' || /Invalid login/i.test(check.error.message) ? 'Старый пароль указан неверно.' : errText(check.error, 'Не удалось проверить старый пароль.')};
      const {error} = await sb.auth.updateUser({password:newPassword});
      if (error) throw error.code === 'same_password' ? {userMessage:'Новый пароль совпадает со старым.'} : error;
      closeSheet(); showToast('Пароль изменён');
    }
    catch (err) { s.busy = false; s.error = errText(err, 'Не удалось сменить пароль.'); renderSheet(); }
  }
});

const textTimers = new Map();
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.draft) { const [wd, i] = t.dataset.draft.split(':'); ui.page.draft[wd][Number(i)] = t.value; return; }
  if (t.dataset.hwText) {
    const id = t.dataset.hwText, h = hwById(id); if (!h) return;
    const value = t.value;
    h.text = value; pendingText.set(id, value);
    clearTimeout(textTimers.get(id));
    textTimers.set(id, setTimeout(() => {
      const cur = hwById(id); if (!cur) return;
      cur.text = value;
      saveHw(cur).then(() => { if (pendingText.get(id) === value) pendingText.delete(id); });
      render();
      const n = document.getElementById('saved-note'); if (n) n.textContent = 'Сохранено';
    }, 600));
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.rename) {
    const s = subjectById(t.dataset.rename); const v = t.value.trim().replace(/\s+/g, ' ');
    if (s && v && v !== s.name) { s.name = v; saveSchedule(); showToast('Переименовано'); }
    else if (s) t.value = s.name;
    return;
  }
  if (t.dataset.room) { const l = state.lessons.find(x => x.id === t.dataset.room); if (l && l.room !== t.value.trim()) { l.room = t.value.trim(); saveSchedule(); } return; }
  if (t.dataset.hwDue) { const h = hwById(t.dataset.hwDue); if (h && t.value) { h.due = t.value; saveHw(h); render(); renderSheet(); } return; }
  const setting = t.dataset.setting;
  if (setting === 'remind') { state.settings.remind = t.checked; savePrefs(); render(); return; }
  if (setting === 'remindTime') { if (t.value) { state.settings.remindTime = t.value; savePrefs(); } return; }
  if (setting === 'dayStart') { if (t.value) { state.settings.dayStart = t.value; saveSchedule(); render(); } return; }
  if (setting === 'lessonLen' || setting === 'breakLen') {
    const v = Math.round(Number(t.value));
    const [lo, hi] = setting === 'lessonLen' ? [20, 90] : [0, 60];
    if (Number.isFinite(v) && v >= lo && v <= hi) { state.settings[setting] = v; saveSchedule(); render(); }
    else { showToast('Введи число от ' + lo + ' до ' + hi); t.value = state.settings[setting]; }
    return;
  }
  const kind = t.dataset.file;
  if (!kind || !t.files?.length) return;
  const files = [...t.files]; t.value = '';
  if (kind === 'import') { importFile(files[0]); return; }
  if (kind === 'add-photo') {
    captureAddText(); ui.sheet.loading = true; renderSheet();
    for (const f of files) { try { ui.sheet.photos.push(await compressImage(f)); } catch (err) { showToast('Не удалось открыть изображение'); } }
    ui.sheet.loading = false; renderSheet(); return;
  }
  if (kind === 'hw-photo') {
    const h = hwById(ui.sheet?.id); if (!h) return;
    ui.sheet.loading = true; renderSheet();
    for (const f of files) {
      try { const d = await compressImage(f); const pid = uid(); if (await savePhoto(pid, d)) h.photos.push(pid); }
      catch (err) { showToast('Не удалось открыть изображение'); }
    }
    if (ui.sheet) ui.sheet.loading = false;
    saveHw(h); renderSheet(); render();
  }
});

/* ---------- boot ---------- */
state.settings.theme = lsGet(THEME_KEY) || 'system';
applyTheme();
render();
setInterval(() => { if (store.authed && state.settings.remind && ui.tab === 'today' && !ui.page && !ui.sheet) render(); }, 60000);
if (sb) sb.auth.onAuthStateChange(event => {
  // Only update the view here; Supabase calls inside this callback can deadlock.
  if (event === 'SIGNED_OUT' && store.authed) { store.authed = false; closeLive(); ui.sheet = null; renderSheet(); render(); }
});
refresh();
})();
</script>
</body>
